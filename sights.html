<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">

<title>景點介紹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+Sung+HK:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Playfair+Display:ital,wght@1,600&family=Inter:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 暖簾標頭 → 黏性分區篩選 → 依地區分組的大卡片（上方 10 張輪播相框，下方介紹、看點、時間票價、交通） */
:root{
  --paper:#EEF0F4; --surface:#FFFFFF; --ink:#191C2B; --muted:#5A6075; --line:#D6DAE4;
  --ai:#27358A; --ai-soft:#E3E6F5; --kin:#A9780F; --kin-soft:#F6EBCF; --warn:#9A3B1F;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 var(--body)}
a{color:var(--ai)}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
header.top{padding-block:24px 0;border-bottom:1px solid var(--line);background:var(--surface)}
.noren{display:flex;gap:6px;margin-bottom:12px}
.noren span{width:34px;height:10px;background:var(--ai);border-radius:0 0 3px 3px}
.noren span:nth-child(2n){opacity:.75}
h1{font:900 clamp(26px,4.4vw,38px)/1.2 var(--display);margin:0;letter-spacing:.02em}
.lede{color:var(--muted);margin:6px 0 0;max-width:64ch}
.tabs{display:flex;gap:4px;margin-top:16px;flex-wrap:wrap}
.tabs a{padding:8px 16px;text-decoration:none;color:var(--muted);border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;font-weight:500}
.tabs a[aria-current="page"]{color:var(--ink);background:var(--paper);border-color:var(--line);margin-bottom:-1px}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding-block:10px}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:13.5px var(--body);padding:5px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ai);background:var(--ai);color:var(--surface);font-weight:700}
.chip .n{font:11px var(--mono);opacity:.75;margin-left:4px}
.search{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:14px var(--body);padding:6px 12px;border-radius:999px;width:220px;max-width:100%}
main{padding-block:16px 48px}
.group{margin-top:26px}
.group>h2{font:900 28px/1.2 var(--display);margin:0 0 4px;display:flex;gap:12px;align-items:baseline}
.group>h2 small{font:500 13px var(--body);color:var(--muted)}
.part{margin-top:14px}
.parth{font:900 19px var(--display);margin:0;display:flex;gap:8px;align-items:baseline;color:var(--ai)}
.parth span{font:12px var(--mono);color:var(--muted)}
.area{margin-top:12px}
.area>h3{font:600 16px var(--display);color:var(--muted);margin:0 0 10px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:18px}
.card{scroll-margin-top:120px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}

.car{position:relative;aspect-ratio:16/10;background:var(--ai-soft);overflow:hidden;max-width:100%;touch-action:pan-y}
.track{display:flex;height:100%;transition:transform .55s ease}
.track figure{flex:0 0 100%;margin:0;height:100%;position:relative}
.track img{width:100%;height:100%;object-fit:cover}
.cap{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 8px;color:#fff;font-size:12.5px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.cap small{display:block;font-size:10.5px;opacity:.8;word-break:break-all}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:20px;cursor:pointer}
.nav.p{left:8px}.nav.n{right:8px}
.dots{position:absolute;top:8px;right:8px;display:flex;gap:4px;background:rgba(0,0,0,.35);padding:4px 6px;border-radius:999px}
.dots button{width:8px;height:8px;padding:0;border-radius:50%;border:0;background:rgba(255,255,255,.5);cursor:pointer}
.dots button[aria-current="true"]{background:#fff}
.count{position:absolute;top:8px;left:8px;font:600 12px var(--mono);color:#fff;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:999px}
.noimg{height:100%;display:flex;align-items:center;justify-content:center;font:900 26px var(--display);color:var(--ai);
  background:repeating-linear-gradient(135deg,var(--ai-soft) 0 14px,var(--surface) 14px 28px)}

.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.name{font:900 22px/1.3 var(--display);margin:0;word-break:break-word}
.tagline{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.tag{padding:1px 8px;border-radius:4px;background:var(--ai-soft);color:var(--ai)}
.tag.book{background:var(--kin-soft);color:var(--kin);font-weight:700}
.intro{margin:0;font-size:14.5px}
.hl{margin:0;padding-left:1.2em;font-size:14px}
dl{margin:0;display:grid;grid-template-columns:3.6em 1fr;gap:3px 10px;font-size:13.5px}
dt{color:var(--muted)} dd{margin:0;min-width:0;word-break:break-word}
details{font-size:13.5px;border-top:1px solid var(--line);padding-top:6px}
details summary{cursor:pointer;color:var(--ai);font-weight:500}
.tkwrap{overflow-x:auto}
.tk{border-collapse:collapse;width:100%;margin-top:6px;min-width:420px}
.tk td,.tk th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
.tk th{font-weight:500;color:var(--muted)}
.tk .pr{font:600 12.5px var(--mono);white-space:nowrap}
.tk td:last-child{white-space:nowrap}
a.tel{font:600 13px var(--mono);white-space:nowrap;text-decoration:none;user-select:all}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.links a{font-size:13px;text-decoration:none;border:1px solid var(--line);padding:4px 12px;border-radius:999px}
.links a.go{background:var(--ai);border-color:var(--ai);color:var(--surface)}
.empty{color:var(--muted);padding:30px 0}
footer{font-size:12.5px;color:var(--muted);padding-block:0 40px}
@media (max-width:640px){ .search{margin-left:0;width:100%} .group>h2{font-size:24px} }
@media (prefers-reduced-motion:reduce){ .track{transition:none} }

/* ===== 共用版型：旅遊雜誌風（白底大照片、宋體標題、圓角柔影卡片；鈷藍取自 icon 帽子＋暖橘點綴） ===== */
:root{
  --paper:#F5F6F8; --surface:#FFFFFF; --ink:#1E2026; --muted:#676B75; --line:#E4E6EB;
  --ai:#2747C8; --ai-soft:#EEF1FB; --kin:#D9692E; --kin-soft:#FCEEE4; --warn:#B23A2A;
  --display:"Chiron Sung HK","Noto Serif TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --latin:"Playfair Display",Georgia,serif;
  --kick:"Inter","Noto Sans TC",sans-serif;
  --shadow:0 2px 4px rgba(20,25,40,.04),0 10px 30px rgba(20,25,40,.08);
  --shadow-sm:0 1px 2px rgba(20,25,40,.04),0 4px 14px rgba(20,25,40,.06);
  --navh:90px;
  color-scheme:light;
}
@media (max-width:720px){ :root{ --navh:118px } }
html{scroll-padding-top:calc(var(--navh) + 70px)}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;letter-spacing:.01em}
a{color:var(--ai);text-underline-offset:3px}

/* ---- 固定導覽列 ---- */
header.site{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line),0 8px 24px rgba(20,25,40,.05)}
header.site .bar{display:flex;align-items:center;gap:24px;min-height:var(--navh);padding-block:12px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);flex:none;min-width:0}
.logo{position:relative;width:60px;height:60px;flex:none}
.logo img{position:relative;z-index:1;width:60px;height:60px;border-radius:50%;object-fit:cover;display:block;box-shadow:0 6px 18px rgba(39,71,200,.28);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.logo::after{content:"";position:absolute;inset:0;border-radius:50%;z-index:2;pointer-events:none;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.6) 50%,transparent 62%);background-size:260% 100%;background-position:160% 0;animation:logo-shine 7s ease-in-out infinite}
.brand:hover .logo img,.brand:focus-visible .logo img{transform:rotate(-8deg) scale(1.07)}
@keyframes logo-shine{0%,72%{background-position:160% 0}100%{background-position:-60% 0}}
.brand-t{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-t b{font:900 24px/1.15 var(--display);letter-spacing:.05em;white-space:nowrap}
.brand-t small{font:italic 600 13.5px/1.3 var(--latin);color:var(--kin);letter-spacing:.06em;white-space:nowrap;margin-top:3px}
nav.sitetabs{display:flex;gap:24px;margin-left:auto;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.sitetabs::-webkit-scrollbar{display:none}
nav.sitetabs a{position:relative;flex:none;padding:10px 0;font:500 15.5px var(--body);color:var(--muted);text-decoration:none;letter-spacing:.04em;transition:color .2s}
nav.sitetabs a:hover{color:var(--ink)}
nav.sitetabs a[aria-current="page"]{color:var(--ink);font-weight:700}
nav.sitetabs a[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:3px;border-radius:3px;background:var(--kin)}
@media (max-width:720px){
  header.site .bar{flex-wrap:wrap;gap:6px 12px;padding-block:10px 0}
  nav.sitetabs{order:2;width:calc(100% + 32px);margin:0 -16px;padding-inline:16px;gap:20px;border-top:1px solid var(--line)}
  nav.sitetabs a{padding:10px 0 9px;font-size:15px}
  .logo,.logo img{width:46px;height:46px}
  .brand-t b{font-size:20px}
  .brand-t small{font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){ .logo::after{animation:none} .logo img{transition:none} }

/* ---- 頁首（雜誌扉頁） ---- */
.hero{padding-block:46px 26px}
.hero .eyebrow{font:700 12.5px var(--kick);letter-spacing:.3em;text-transform:uppercase;color:var(--kin);margin:0 0 6px}
.hero h1{font:900 clamp(32px,6vw,52px)/1.12 var(--display);letter-spacing:.03em;margin:0;text-wrap:balance}
.hero .lede{max-width:58ch;color:var(--muted);margin:12px 0 0;font-size:16px}
.hero .meta{margin-top:14px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 18px}
.hero .meta b{color:var(--ink);font-weight:500}
header.top,.noren{display:none!important}

/* ---- 篩選列接在導覽列下方 ---- */
.filters,nav.toc{top:var(--navh)!important;background:rgba(245,246,248,.95)!important;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)!important}

/* ---- 卡片與面板：圓角、柔和陰影、無框線 ---- */
.card,.panel,section.sec,.dish,.route,.quick,details.leg{border:0!important;border-radius:16px!important;box-shadow:var(--shadow)!important;background:var(--surface)}
.route,.quick,details.leg{box-shadow:var(--shadow-sm)!important}
.card{overflow:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
@media (hover:hover){ .card:hover{transform:translateY(-3px);box-shadow:0 4px 8px rgba(20,25,40,.05),0 18px 40px rgba(20,25,40,.12)!important} }
.card.top{box-shadow:0 0 0 2px var(--kin),var(--shadow)!important}
.ph,.car,.noph{border-radius:0!important}
.info img,.stx img,.gallery img,.dish img{border-radius:12px!important}
.dish img{border-radius:0!important}
.mylist li,.tips,.sig,.tk{border-radius:10px!important}

/* ---- 按鈕、標籤：膠囊 ---- */
.chip,.seg,.btn,.links a,.search,.tag,.rv,.lv,.conf,.linepill,.badge{border-radius:999px!important}
select,input{border-radius:10px!important}
.chip{border:1px solid var(--line)!important;background:var(--surface);color:var(--ink);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ai)!important;border-color:var(--ai)!important;color:#fff!important}
.seg{border:1px solid var(--line)!important;background:var(--surface)!important;overflow:hidden}
.seg button[aria-pressed="true"]{background:var(--ai)!important;color:#fff!important}
.btn.primary,.links a.go{background:var(--ai)!important;border-color:var(--ai)!important;color:#fff!important}
.links a{border-color:var(--line)!important}
.tag{background:var(--ai-soft)!important;color:var(--ai)!important;border:0!important;padding:2px 10px!important}
.badge{padding:3px 11px!important}
.badge.f1{background:var(--kin)!important;border-color:var(--kin)!important;color:#fff!important}
.sig{background:var(--kin-soft)!important}
.sig b{color:var(--kin)!important}
.lv.h{background:var(--kin)!important;border-color:var(--kin)!important}

/* ---- 標題字 ---- */
.name,.city>h2,.group>h2,section.sec>h2,.panel>h2,.infotext h3,.dish b,.parth,.area>h3,.area h3,.route h3,.quick h2{font-family:var(--display)!important;letter-spacing:.03em}
.name{font-weight:900!important}
.city>h2,.group>h2{font-weight:900!important;font-size:clamp(28px,4.5vw,36px)!important;margin-top:8px}
.city>h2 small,.group>h2 small{font-family:var(--kick)!important;letter-spacing:.12em}
.area>h3,.area h3{font-weight:700!important;border-bottom:0!important;padding-bottom:0!important}
.area>h3::before,.area h3::before{content:"";display:inline-block;width:18px;height:3px;border-radius:3px;background:var(--kin);vertical-align:middle;margin-right:8px}
.parth{color:var(--ai)!important}

/* ---- 手機 ---- */
@media (max-width:720px){
  .filters,nav.toc{position:static!important}
  .filters .frow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .filters .frow::-webkit-scrollbar{display:none}
  .filters .frow>*{flex:none}
  .filters .flabel{width:auto!important;margin-right:4px}
  .filters .tools{width:auto!important}
  .filters .search{width:200px!important}
  #frow .search{width:180px!important}
}
@media (max-width:640px){
  .wrap{padding-inline:16px}
  .hero{padding-block:28px 16px}
  .grid,.pick{grid-template-columns:1fr!important}
  .search{margin-left:0!important}
}
.addplan{font:500 13px var(--body);border:1px dashed var(--ai)!important;background:var(--surface);color:var(--ai);padding:4px 12px;border-radius:999px;cursor:pointer}
.addplan[aria-pressed="true"]{background:var(--ai-soft);border-style:solid!important;font-weight:700}
.basketfab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--kin);color:#fff!important;text-decoration:none;font:700 15px var(--body);padding:12px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(217,105,46,.35)}
.basketfab b{font-family:var(--mono);background:#fff;color:var(--kin);border-radius:999px;padding:0 8px;margin:0 2px}
.basketfab[hidden]{display:none!important}
</style>

-img/harukas/02.jpg", "caption": "夜間點燈的HARUKAS", "credit": "Type specimen, CC BY-SA 3.0, https://commons.wikimedia.org/wiki/File:Osaka_Abeno_Harukas.jpg"}, {"file": "sights-img/harukas/03.jpg", "caption": "近鐵百貨本店與塔樓", "credit": "Tokumeigakarinoaoshima, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:KINTETSU_DEPARTMENT_STORE_MAIN_STORE_ABENO_HARUKAS_on_7th_November_2023.jpg"}, {"file": "sights-img/harukas/04.jpg", "caption": "從中之島遠眺HARUKAS", "credit": "Mc681, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Abeno_Harukas_viewed_from_the_Nakanoshima_Festival_Tower_in_201510_001.JPG"}, {"file": "sights-img/harukas/05.jpg", "caption": "HARUKAS 300 入口候梯區", "credit": "Wpcpey, CC BY 4.0, https://commons.wikimedia.org/wiki/File:HARUKAS_300_Level_15_Waiting_Area_2014.jpg"}, {"file": "sights-img/harukas/06.jpg", "caption": "頂樓戶外體驗EDGE", "credit": "Project Kei, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Abeno_Harukas_EDGE_THE_HARUKAS.jpg"}, {"file": "sights-img/harukas/07.jpg", "caption": "俯瞰天王寺公園與市區", "credit": "Choi2451, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:View_of_Osaka_from_Abeno_Harukas.jpg"}, {"file": "sights-img/harukas/08.jpg", "caption": "遠眺大阪灣與明石海峽大橋", "credit": "掬茶, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:View_of_the_Osaka_Bay_Area_from_Abeno_Harukas_20250901.jpg"}, {"file": "sights-img/harukas/09.jpg", "caption": "60樓展望台大阪夜景", "credit": "Hiroaki Kaneko, CC BY-SA 3.0, https://commons.wikimedia.org/wiki/File:大阪夜景_(The_night_view_of_Osaka_from_Abeno_Harukas)_27_Sep,_2014_-_panoramio.jpg"}, {"file": "sights-img/harukas/10.jpg", "caption": "58樓的天空庭園", "credit": "Wpcpey, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Abeno_Harukas_SKY_GARDEN_300_2014.jpg"}], "book": false, "tel": "", "tags": []}, {"id": "umedasky", "name": "梅田藍天大廈（梅田スカイビル）", "group": "osaka", "sub": false, "areaLabel": "梅田・北區", "intro": "梅田藍天大廈高173公尺，由原廣司設計、1993年完工，兩棟40層高塔在頂部以圓形開口的「空中庭園」相連，造型非常特別。可搭玻璃管狀的空中手扶梯往上；大樓腳下有日式庭園「中自然之森」，旁邊就是新開的Grand Green大 ": "黃昏點燈的神戶港", "credit": "Martin Falbisoner, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Kobe_Port_Tower_and_Maritime_Museum,_November_2016.jpg"}, {"file": "sights-img/kobeport/03.jpg", "caption": "美利堅公園夜景", "credit": "Kakidai, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Meriken_Park_at_night.jpg"}, {"file": "sights-img/kobeport/04.jpg", "caption": "公園與海洋博物館船帆屋頂", "credit": "Mocchy, Public domain, https://commons.wikimedia.org/wiki/File:Kobe_Meriken_Park_(daytime).JPG"}, {"file": "sights-img/kobeport/05.jpg", "caption": "神戶塔與背後的六甲山", "credit": "KishujiRapid, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Kobe_Port_Tower_20201114.jpg"}, {"file": "sights-img/kobeport/06.jpg", "caption": "BE KOBE 字樣地標", "credit": "Kazuyuki N, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:BE_KOBE_20190216.jpg"}, {"file": "sights-img/kobeport/07.jpg", "caption": "震災紀念公園的碼頭遺構", "credit": "Saigen Jiro, CC0, https://commons.wikimedia.org/wiki/File:Port_of_Kobe_Earthquake_Memorial_Park,_gaikan-1.jpg"}, {"file": "sights-img/kobeport/08.jpg", "caption": "從神戶塔俯瞰港灣", "credit": "Zairon, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Kobe_Kobe_Port_Tower_Blick_auf_die_Harbour_Area_04.jpg"}, {"file": "sights-img/kobeport/09.jpg", "caption": "整修後的神戶塔夜間", "credit": "ノボホショコロトソ, CC BY 4.0, https://commons.wikimedia.org/wiki/File:Kobe_Port_Tower_in_November_2025_at_night_06.jpg"}, {"file": "sights-img/kobeport/10.jpg", "caption": "海邊步道看神戶塔", "credit": "x768, CC BY-SA 2.0, https://commons.wikimedia.org/wiki/File:Kōbe_Port_Tower,_Meriken_Park_(15871783216).jpg"}], "book": true, "tel": "078-335-6580", "tags": []}, {"id": "mayasan", "name": "摩耶山掬星台（きくせいだい）", "group": "osaka", "sub": true, "areaLabel": "神戶・摩耶山", "intro": "摩耶山頂海拔約 700 公尺的展望廣場，名字意思是「伸手就能捧起星星」。夜景號稱「千萬美元夜景」，從神戶港、大阪灣一路看到大阪市區。從山腳搭復古登山纜車（ケーブル）再轉空中纜車（ロープウェー），各約 5 分鐘，坐車本身就很有趣。", "highlights": ["掬星台：視野橫跨神戶到大阪的「千萬美元夜景」", "まやビューライン：登山纜車＋空中纜車，沿途可見舊摩耶觀光飯店廢墟", "白天可散步到摩耶山天上寺，傍晚看夕陽轉夜景"], "hours": "掬星台全天開放；纜車 10:00–17 g/minoo/10.jpg", "caption": "沿溪平緩的滝道", "credit": "Laitche, CC BY-SA 4.0, https://commons.wikimedia.org/wiki/File:Waterfall_Trail_(Promenade)_in_Meiji_no_Mori_Minō_Quasi-National_Park,_October_2024_-_5602.jpg"}], "book": false, "tel": "072-721-3014", "tags": []}, {"id": "mozu", "name": "百舌鳥古墳群・仁德天皇陵古墳（大仙古墳／だいせんこふん）", "group": "osaka", "sub": true, "areaLabel": "堺市", "intro": "2019 年與古市古墳群一起登錄世界遺產。仁德天皇陵古墳（大山・大仙古墳）全長約 486 公尺，是日本最大的前方後圓墳，與金字塔、秦始皇陵並稱世界三大墳墓。在地面上只看得到茂密森林與護城河，想看到鑰匙孔形狀，可以上免費的堺市役所 21 樓展望大廳，或在大仙公園搭氦氣球升到約 100 公尺高空。", "highlights": [], "hours": "拜所全天開放（建議白天前往）；堺市博物館 9:30–17:15（週一休）", "fee": "古墳免費；堺市博物館一般 200 円", "season": "10–11 月氣候涼爽，適合繞古墳散步；大仙公園日本庭園紅葉約在 11 月下旬。氣球原則上全年無休，強風、雷雨時停飛。2026/3/20–2027/3/28 的週六、週日與假日，有免費「世界遺產・氣球接駁巴士」連接大仙公園、さかい利晶の杜與堺舊港（每小時約 1 班）。", "tickets": [{"item": "堺市役所 21 樓展望ロビー", "price": "免費", "url": "https://osaka-info.jp/spot/21st-floor-observation-lobby-sakai-hall/", "need_booking": false, "note": "南海高野線堺東站步行約 5 分；高約 80 m，看得到古墳的森林（完整形狀要從空中看）。"}, {"item": "堺市博物館", "price": "200 円", "url": "https://www.city.sakai.lg.jp/kanko/hakubutsukan/annai/kaikanzikan.html", "need_booking": false, "note": "大學・高中生 100 円、中小學生 50 円；特展期間票價可能調整。可刷卡或用 QR 碼支付。"}, {"item": "おおさか堺バルーン（氦氣球，升到約 100 m）", "price": "4,200 円（網路預約 4,000 円）", "url": "https://osaka-sakai-balloon.com/guidance.html", "need_booking": false, "note": "現場可買票，但預約者優先；乘坐日 10 天前 0:00 起可在官網預約（外國旅客使用網頁預約連結）。3–15 歲 3,000 円（網路 2,800 円）。天候不佳時停飛。", "tel": "050-1722-4848", "tel_source": "おおさか堺バルーン 運営会社 アドバンス株式会社大阪支店（AI 自動應答，有人 10:00～12:00／13:00～17:00）｜https://osaka-sakai-balloon.com/guidance.html"}, {"item": "世界遺產・氣球接駁巴士", "price": "免費", "url": "https://www.sakai-tcb.or.jp/feature/detail/106", "need_booking": false, "note": "只在週六、週日及假日行駛，9:00–18:00，每天 8 班。"}], "tips": ["御堂筋線終點なかもず（M30）離仁德天皇陵約 2.5 km，步行要 35 分鐘以上，不是最方便的選項；搭 JR 到百舌鳥最近。", "推薦路線：なんば → 堺東（展望台）→ 步行或搭巴士到大仙公園（博物館、遊客中心、氣球）→ JR 百舌鳥 → 天王寺。", "古墳本體是宮內廳管理的陵墓，不能進入；拜所在南側正面。", "遊客中心的 8K 空拍影片很值得一看，也有古墳造型的周邊商品。"], "trip": [{"label": "從天王寺（JR 阪和線，最近）", "total_m   if (!('IntersectionObserver' in window)) return;
  io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? visible.add(e.target) : visible.delete(e.target)), {threshold:.5});
  document.querySelectorAll('.car[data-id]').forEach(c => io.observe(c));
}
if (!reduce) setInterval(() => { for (const c of visible) if (!c.matches(':hover') && !c.contains(document.activeElement) && !c.dataset.hold) go(c, +c.dataset.i + 1); }, 4500);
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.g){ st.g = b.dataset.g; render(); return; }
  const car = b.closest('.car'); if (!car) return;
  if (b.dataset.step) go(car, +car.dataset.i + +b.dataset.step);
  else if (b.dataset.go) go(car, +b.dataset.go);
});
document.addEventListener('keydown', e => { const car = e.target.closest?.('.car'); if (!car) return; if (e.key==='ArrowLeft') go(car, +car.dataset.i-1); if (e.key==='ArrowRight') go(car, +car.dataset.i+1); });
let sx = null, scar = null;
document.addEventListener('pointerdown', e => { scar = e.target.closest('.car'); if (scar){ sx = e.clientX; scar.dataset.hold = '1'; } });
document.addEventListener('pointerup', e => { if (scar){ const dx = e.clientX - sx; if (Math.abs(dx) > 40) go(scar, +scar.dataset.i + (dx < 0 ? 1 : -1)); setTimeout(() => { if (scar) delete scar.dataset.hold; scar = null; }, 3000); } });
render();
const jump = () => { const h = location.hash.slice(1); const el = h && document.getElementById(h); if (el) el.scrollIntoView({block:'start'}); };
jump(); window.addEventListener('load', jump);

/* ---------- 行程籃（與「行程規劃」頁共用） ---------- */
(function(){
  const KEY = 'jd-basket';
  const get = () => { try { return JSON.parse(localStorage.getItem(KEY)||'[]'); } catch(e) { return []; } };
  const set = v => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e) {} };
  const fab = document.createElement('a'); fab.className = 'basketfab'; fab.href = 'plan.html'; document.body.appendChild(fab);
  function sync(){
    const b = get();
    fab.innerHTML = `行程籃 <b>${b.length}</b> → 排行程`; fab.hidden = !b.length;
    document.querySelectorAll('[data-plan]').forEach(x => { const on = b.includes(x.dataset.plan); x.setAttribute('aria-pressed', on); x.textContent = on ? '✓ 已加入行程' : '＋行程'; });
  }
  document.addEventListener('click', e => {
    const x = e.target.closest('[data-plan]'); if (!x) return;
    e.preventDefault(); e.stopPropagation();
    const b = get(), id = x.dataset.plan, i = b.indexOf(id);
    if (i >= 0) b.splice(i,1); else b.push(id);
    set(b); sync();
  }, true);
  new MutationObserver(() => { clearTimeout(sync.t); sync.t = setTimeout(sync, 50); }).observe(document.body, {childList:true, subtree:true});
  addEventListener('storage', sync); sync();
})();

</script>
